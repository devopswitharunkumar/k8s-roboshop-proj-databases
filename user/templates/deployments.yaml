apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-ds
  namespace: roboshop
  labels:
    app: user
    project: roboshop
    tier: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: user
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        app: user
        project: roboshop
        tier: app
    spec:
      containers:
      - name: user
        image: "narupallearun/user: {{ .Values.image.tag }}"
        imagePullPolicy: Always
        resources:
          requests: 
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "256Mi"
        envFrom:
        - configMapRef: 
            name: user-config