apiVersion: v1 
kind: Service 
metadata: 
  name: rabbitmq-service 
  namespace: roboshop
  labels:
    app: rabbitmq 
    project: roboshop 
    tier: db 
spec:
  clusterIP: None 
  selector:
    matchLabels:
      app: rabbitmq 
      project: roboshop 
      tier: db 
  ports:
  - protocol: TCP
    port: 5672
    targetPort: 5672

