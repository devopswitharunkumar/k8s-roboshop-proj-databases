apiVersion: v1 
kind: Service 
metadata:
  name: mongodb-service 
  namespace: roboshop
  labels:
    app: mongodb
    project: roboshop
    tier: db 
spec:
  clusterIP: None  
  selector:
    matchLabels:
      app: mongodb
      project: roboshop
      tier: db 
  ports:
  - protocol: TCP 
    port: 27017 
    targetPort: 27017