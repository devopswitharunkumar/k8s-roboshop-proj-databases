apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-ds
  namespace: roboshop
  labels:
    app: payment
    project: roboshop
    tier: app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: payment
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        app: payment
        project: roboshop
        tier: app
    spec:
      containers:
      - name: payment
        image: "narupallearun/payment: {{ .Values.image.tag }}"
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "256Mi"
        envFrom:
        - configMapRef: 
            name: payment-config